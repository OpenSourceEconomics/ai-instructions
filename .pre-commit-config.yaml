---
repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.27.1
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-ruff
        args: [--wrap, '88']
        # `commands/` is deliberately absent: those files open with YAML
        # frontmatter, and mdformat rewrites the `---` fences into a thematic
        # break plus a heading, which silently destroys the slash command.
        files: (AGENTS\.md|CLAUDE\.md|README\.md|modules/.*\.md|profiles/.*\.md)
  - repo: local
    hooks:
      # This repo states both rules in prose; running them here keeps it from
      # shipping a standard its own sources would fail.
      - id: no-hardcoded-user-paths
        name: no hardcoded user-specific absolute paths
        language: pygrep
        entry: (/home/[A-Za-z0-9_.-]+/|/Users/[A-Za-z0-9_.-]+/|[A-Za-z]:\\Users\\)
        types_or: [python, toml]
      - id: no-section-separator-comments
        name: no decorative section-separator comments
        language: pygrep
        entry: ^\s*#\s*[-=#_*]{10,}\s*$
        types: [python]
ci:
  autoupdate_schedule: monthly
